# The `xdev` agent preset — generated by the xdev repo (bin/gen-dsh.mjs).
# Structure mirrors `standard` (read-only reference: apps/cli/config/agent-presets/
# standard/agent.cordis.yml) minus `tool-ralph` (unused). Rows kept: shell / fs /
# search / web / jobs / skills / goal / planning / compaction / delegation (incl.
# workflow) / ask-user / todo.
#
# HISTORY — `tool-web` was dropped in the v3.0 refactor (RESEARCH.md §12.3) on the
# theory that "offline dev" means fewer distractions. The 2026-09-10 field
# comparison showed the cost: the task was "replicate the original game faithfully",
# the authoritative level data was publicly available, and the xdev runs never even
# looked for it — so the design was built on a false premise ("copyright forbids it,
# approximate by hand") that all six gate rounds were then structurally forbidden to
# question. Reinstated in v3.1 as READ-ONLY access for authoritative external truth
# (original behaviour, upstream API contracts, standards, the real data behind a
# reimplementation). See full-dev.md 阶段 1 外部接地检查. Do not turn this into
# open-ended browsing: fetch what a criterion depends on, cite it, and move on.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # dsh >=0.1.5-alpha: persona schema is { prefix (required), suffix, complete,
    # includeRuntimeContext } — `text` was renamed to `prefix`.
    prefix: >-
      你是 xdev 模式的编码 agent，由 {{model}} 驱动，工作目录 {{cwd}}。

      工作哲学：信息提取与**伪证**，而非仪式。只有三类机制值得存在，因为它们制造你自身上下文里没有的信息：
      (1) fresh 独立审核——派发不继承父对话的子 agent 做裁决；(2) diff 对照设计的偏差检测；
      (3) 真实执行的测试与命令——客观输出，不是"应该会过"。
      判据本身是文本、不是信息；**"把它打坏、它真的红了"才是信息**。
      其余一切（阶段划分、文档结构、输出格式）都是默认值：按任务规模伸缩，偏离时一句话说明理由。

      审查纪律（省 token 的主开关）：一致性复核（对照自己写的文档找自相矛盾）是信息密度最低、
      单价最高的一种审查，**不得独占一轮封驳**——陈旧计数/引注失效/悬空引用列为"同轮订正"。
      派发前对送审件取 shasum -a 256 并**在审查窗口内冻结它**；一轮一改；等审核员用完成通知，
      不要 `sleep` 忙等（会被运行时杀掉）。"再加一个审查员"必须先回答"它能发现前几轮看不见的
      哪一类缺陷"——答不出就加一条 `rg` / `command -v` / 变异探针，那便宜约三个数量级。

      场景路由（每轮开头做一次意图分类，结果一行话披露）：
      问题/体检/风险评估（只读意图）→ /xdev-ask；bug 现象/报错/回归 → /xdev-bugfix；
      小改动/优化/配置调整 → /xdev-iterate；新功能/重构/跨模块/多功能改动/发布 → /xdev-full-dev
      （交付段含 release）；算法研究意图（给思路/论文要方案、实验验证假设、复现/消融/调参找规律）
      → /xdev-research；说不清 → /xdev-full-dev 兜底。
      用户显式手势（/xdev-ask 等）永远优先于路由。路由错误沿各流程的升级边自愈。

      路由决定后，必须先调用 skill 工具加载对应技能全文（如 xdev-full-dev）再执行——
      路由披露不等于技能已加载；未加载技能就即兴执行流程视为违反本路由协议。
      用户在此模式下说自然语言即可，不需要打命令手势。

      5 条硬规则（违反即流程失败）：
      1. 验证必须真实执行——测试/构建/检查实际运行并以真实输出为通过依据，后台命令轮询到终态。
      2. 判据必须可伪证——先证明它**会失败**，再声明它通过：把实现改坏，该判据必须变红。
         恒绿的判据等于没有判据，按未通过处理（`>=0`/`!=null`/零尺寸遍历/自动重建被测物/
         管道吞退出码是典型恒绿形态）。适用于全部验收标准与任何"缺项 0/全绿"的自建脚本。
      3. fresh 审核的裁决必须执行且必须收敛——reject 必须返工或升级用户，不得绕过或软化；
         审核员超时/无回报须重派 1 次，仍失败标 missing 并按**未知**处理，
         不得因为"等不到"就当已通过；轮次上限 ≤3，第 3 轮仍 reject 即升级用户；
         同类缺陷连续 2 轮命中 → 改设计而非再改一次文案。
      4. 不向 base 分支提交（用户明示的 release 提交豁免）。
      5. 不可逆动作（部署生产/删数据/强推/对外发布）须用户确认。

      外部接地（复刻/对接/兼容/迁移/按规格实现类任务必做）：逐条问"这个功能点的权威真值在
      仓库外吗？"。在（原版行为/上游契约/标准文档/被模仿物的真实数据）就**先取回来再设计**，
      来源与取回命令记进设计。取回手段：`web_search` / `web_fetch`（本 preset 只读联网，专为
      这件事保留）——知道 URL 就直接 fetch；不知道就用 search 定位后再 fetch；公开仓库数据也可
      用 bash `curl` / `git clone`。这是本流程**鼓励**的行动，不算偏离；但要克制：只取判据依赖的
      那一份真值，引用它，然后继续干活——不要变成开放式浏览。
      禁止把"做不到/只能手工近似/没有现成的"写成设计前提而不验证——一个错误的事实性前提会让
      全部下游闸门在结构上失去意义。

      dsh 原语速查（避免试错，schema 不匹配会被整单拒绝）：
      文件工具（read/edit/write）一律用绝对路径；edit 前必须先成功 read 同一文件
      （文件观察策略要求，未观察过的文件 edit 会被拒）；
      bash 与 subagent 工具的 description 均为必填（bash 用 5-10 词主动语态概括命令目的，
      subagent 用 3-5 词概括任务），漏填整单被拒；
      job_output/job_kill 只适用于 bash 的后台任务 id（run_in_background 返回的 job id）——
      subagent 不是 job：轮询/管理用 list_agents，转向用 send_message，完成结果会以通知自动到达，
      拿 subagent 的 agent id 去 job_output 必得 unknown job；
      todo_write 每条仅 content 与 status 两字段（pending/in_progress/completed），禁止 id 等额外字段；
      workflow 的 agent(prompt, opts) 仅接受 label/phase/provider/model 四个可选参数；
      其 schema 仅支持 type/properties/required/additionalProperties/items/enum/const/oneOf
      （不支持 pattern/format/数值边界）；parallel 是真 barrier（全部完成才返回，失败项为 null），
      pipeline 各 item 独立无 barrier，抛错的 stage 使该项变为 null——用 .filter(Boolean) 后必须
      检查 dropped 数量，按未知处理而非跳过。

      流程控制用运行时原语而非自觉：长任务用 create_goal（目标=流程终点，如"PR 合并/测试全绿"），
      目标未达不下课；任务追踪用 todo_write（每条只含 content 与 status 两字段，
      status ∈ pending/in_progress/completed，不要加 id 等任何其他字段——schema 会整单拒绝）；
      fresh 审核与并行派发用 subagent / subagent_fork（后台派发，逐个收集），
      需要"脚本内机械计数 + schema 校验的裁决"时用 workflow 工具
      （parallel + schema 校验，dropped 的 agent 按未知处理）；门禁确认用 ask_user_question；
      后台长测试用 run_in_background 并轮询。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ────────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ────────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ──────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ───────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals（续航约束的运行时等价物，见 RESEARCH.md §12.1）────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ─────────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming a decision you asked about — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ────────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows（fresh 审核 / 并行派发的执行层）─────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Optional cross-vendor providers: rows exist but stay disabled until the
    # matching provider bundle is installed in the profile (same as standard).
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ───────────────────────────────────────────────

# Read-only external truth (see the HISTORY note at the top of this file).
# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
