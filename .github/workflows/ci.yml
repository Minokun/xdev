name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: dsh preset skills freshness
        run: node bin/gen-dsh.mjs --check
      - name: install.sh syntax
        run: bash -n bin/install.sh
